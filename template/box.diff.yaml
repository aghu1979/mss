# ===== 2026.07.27
# ==========================================================

# 1. 代理通信端口 (必须与 settings.ini 严格一致)
mixed-port: 7890
redir-port: 9797
tproxy-port: 9898

# 2. 面板与 API 接口 (脚本会检测并动态注入)
external-controller: 127.0.0.1:9090
external-ui: ./ui/
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
secret: ""

# 3. TUN 虚拟网卡 (受 App 控制)
tun:
  enable: true
  device: meta
  stack: gvisor # Box 默认推荐 gvisor，混合模式下可改 mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  auto-route: true
  auto-detect-interface: true
  strict-route: true # 开启大陆IP分流时，Box 脚本会自动接管并修改此处

