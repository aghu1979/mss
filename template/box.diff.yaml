# ===== 作者：Mary
# ===== 2026.07.27
# ==========================================================

# 1. 代理通信端口 (必须与 settings.ini 严格一致)
mixed-port: 7890
redir-port: 9797
tproxy-port: 9898

# 2. 面板与 API 接口 (脚本会检测并动态注入)
external-controller: 127.0.0.1:9090
external-ui: ./ui/
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
secret: ""

# 3. 嗅探功能
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 5228, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain: # 如遇需内部通信的应用请放行该域名
    - "+.io.mi.com"

# 4. TUN 虚拟网卡 (受 App 控制)
tun:
  enable: true
  device: meta
  stack: gvisor # Box 默认推荐 gvisor，混合模式下可改 mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true
  strict-route: true # 开启大陆IP分流时，Box 脚本会自动接管并修改此处

