# ==========================================================
# ===== 3. 策略组与细粒度节点 (Groups) =====
# ==========================================================
x-group-anchors:
  Filters:
    HK: &FilterHK '(?i)(?:港|香港|🇭🇰|HK|Hong\s?Kong)'
    TW: &FilterTW '(?i)(?:台|台湾|🇼🇸|🇹🇼|TW|Taiwan)'
    SG: &FilterSG '(?i)(?:坡|新加坡|🇸🇬|SG|Singapore)'
    JP: &FilterJP '(?i)(?:日|日本|🇯🇵|JP|Japan)'
    US: &FilterUS '(?i)(?:美|美国|🇺🇸|US|States|America)'
    Other: &FilterOther '^(?!.*(香港|台湾|新加坡|日本|美国|🇭🇰|🇼🇸|🇨🇳|🇹🇼|🇸🇬|🇯🇵|🇺🇸|HK|TW|SG|JP|US))'

proxies:
  - {name: 🟢 直连, type: direct, udp: true}
  - {name: ⛔️ 拒绝, type: reject}
  - {name: ⭕️ DNS_Hijack, type: dns}

proxy-groups:
  # === 顶层极简控制中枢 ===
  - name: 🚀 直连优先
    type: select
    hidden: false
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Domestic.png"
    proxies: [🟢 直连, ☁️ SubCF-All, 👑 SubPre-All, ☁️ SubCF-新加坡, ☁️ SubCF-日本, ☁️ SubCF-香港, ☁️ SubCF-台湾, ☁️ SubCF-美国, ☁️ SubCF-其它, 👑 SubPre-新加坡, 👑 SubPre-日本, 👑 SubPre-香港, 👑 SubPre-台湾, 👑 SubPre-美国, 👑 SubPre-其它, 🆓 SubFree-All, 🆓 SubFree-新加坡, 🆓 SubFree-日本, 🆓 SubFree-香港, 🆓 SubFree-台湾, 🆓 SubFree-美国, 🆓 SubFree-其它]

  - name: 🪙 收费优先
    type: select
    hidden: false
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
    proxies: [👑 SubPre-新加坡, 👑 SubPre-日本, 👑 SubPre-香港, 👑 SubPre-台湾, 👑 SubPre-美国, 👑 SubPre-其它, 👑 SubPre-All, ☁️ SubCF-All, ☁️ SubCF-新加坡, ☁️ SubCF-日本, ☁️ SubCF-香港, ☁️ SubCF-台湾, ☁️ SubCF-美国, ☁️ SubCF-其它, 🆓 SubFree-All, 🆓 SubFree-新加坡, 🆓 SubFree-日本, 🆓 SubFree-香港, 🆓 SubFree-台湾, 🆓 SubFree-美国, 🆓 SubFree-其它, 🟢 直连]

  - name: 🆓 免费优先
    type: select
    hidden: false
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Bypass.png"
    proxies: [☁️ SubCF-All, ☁️ SubCF-新加坡, ☁️ SubCF-日本, ☁️ SubCF-香港, ☁️ SubCF-台湾, ☁️ SubCF-美国, ☁️ SubCF-其它, 👑 SubPre-All, 👑 SubPre-新加坡, 👑 SubPre-日本, 👑 SubPre-香港, 👑 SubPre-台湾, 👑 SubPre-美国, 👑 SubPre-其它, 🆓 SubFree-All, 🆓 SubFree-新加坡, 🆓 SubFree-日本, 🆓 SubFree-香港, 🆓 SubFree-台湾, 🆓 SubFree-美国, 🆓 SubFree-其它, 🟢 直连]

#  WebRTC 防泄漏开关。平时保持"拒绝"，使用网页视频会议(如Zoom网页版)没声音/画面时再切"直连"。
  - name: 🛡️ WebRTC
    type: select
    hidden: false
    proxies: [⛔️ 拒绝, ⭕️ DNS_Hijack, 🟢 直连]
    icon: "https://cdn.jsdelivr.net/gh/GitMetaio/Surfing@main/app/icon/WebRTC.svg"

  # === 底层细粒度地区组 (全部静默隐藏) ===
  - {name: 👑 SubPre-新加坡, type: url-test, use: [SubPre], filter: *FilterSG, hidden: true}
  - {name: 👑 SubPre-日本, type: url-test, use: [SubPre], filter: *FilterJP, hidden: true}
  - {name: 👑 SubPre-香港, type: url-test, use: [SubPre], filter: *FilterHK, hidden: true}
  - {name: 👑 SubPre-台湾, type: url-test, use: [SubPre], filter: *FilterTW, hidden: true}
  - {name: 👑 SubPre-美国, type: url-test, use: [SubPre], filter: *FilterUS, hidden: true}
  - {name: 👑 SubPre-其它, type: url-test, use: [SubPre], filter: *FilterOther, hidden: true}
  - {name: 👑 SubPre-All, type: select, use: [SubPre], hidden: true}

  - {name: ☁️ SubCF-新加坡, type: url-test, use: [SubCF], filter: *FilterSG, hidden: true}
  - {name: ☁️ SubCF-日本, type: url-test, use: [SubCF], filter: *FilterJP, hidden: true}
  - {name: ☁️ SubCF-香港, type: url-test, use: [SubCF], filter: *FilterHK, hidden: true}
  - {name: ☁️ SubCF-台湾, type: url-test, use: [SubCF], filter: *FilterTW, hidden: true}
  - {name: ☁️ SubCF-美国, type: url-test, use: [SubCF], filter: *FilterUS, hidden: true}
  - {name: ☁️ SubCF-其它, type: url-test, use: [SubCF], filter: *FilterOther, hidden: true}
  - {name: ☁️ SubCF-All, type: select, use: [SubCF], hidden: true}

  - {name: 🆓 SubFree-新加坡, type: url-test, use: [SubFree], filter: *FilterSG, hidden: true}
  - {name: 🆓 SubFree-日本, type: url-test, use: [SubFree], filter: *FilterJP, hidden: true}
  - {name: 🆓 SubFree-香港, type: url-test, use: [SubFree], filter: *FilterHK, hidden: true}
  - {name: 🆓 SubFree-台湾, type: url-test, use: [SubFree], filter: *FilterTW, hidden: true}
  - {name: 🆓 SubFree-美国, type: url-test, use: [SubFree], filter: *FilterUS, hidden: true}
  - {name: 🆓 SubFree-其它, type: url-test, use: [SubFree], filter: *FilterOther, hidden: true}
  - {name: 🆓 SubFree-All, type: select, use: [SubFree], hidden: true}

