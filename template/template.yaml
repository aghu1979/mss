# ==========================================================
# ===== 核心全量模板 (默认配置: Box 端 + Smart 策略) =====
# 说明: 此模板是一份完整的可执行配置。其他终端(PC/路由)的 diff 
#       文件会在合并时自动替换同名键值。
# ==========================================================

# ===== 1. 全局基础与网络栈配置 =====
ipv6: true
mode: Rule
log-level: warning
unified-delay: true
tcp-concurrent: true
allow-lan: true
mixed-port: 7890
redir-port: 9797
tproxy-port: 9898
external-controller: 127.0.0.1:9090
external-ui-url: "https://github.boki.moe/https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
secret: ""
skip-auth-prefixes: [10.0.0.1/8, 127.0.0.1/8, 192.168.0.1/16]

geo-auto-update: true
geo-update-interval: 360
geox-url:
  asn: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

lgbm-auto-update: true
lgbm-update-interval: 360
lgbm-url: "https://github.boki.moe/https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model-large.bin"

profile:
  store-selected: true
  store-fake-ip: true
  smart-collector-size: 100

ntp:
  enable: true
  write-to-system: false
  server: time.apple.com
  port: 123
  interval: 30

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP: {ports: [80, 8080-8880], override-destination: true}
    TLS: {ports: [443, 5228-5230, 8443]}
    QUIC: {ports: [443, 8443]}
  force-domain: ["+.v2ex.com"]
  skip-domain: ["+.local", "+.lan", "localhost", "Mijia Cloud", "miwifi.com", "+.ts.net", "+.rustdesk.com", "+.anydesk.com", "+.teamviewer.com", "+.oray.com", "+.oray.net", "+.easytier.top"]

# Box 端默认网络栈行为 (移交路由权给底层防火墙 iptables)
tun:
  enable: true
  device: Meta
  stack: mixed
  dns-hijack: [any:53, tcp://any:53]
  udp-timeout: 300
  auto-route: false
  auto-detect-interface: true
  strict-route: false

# DNS 设置（极简高效版：通过国内 DoH 抢答直连与代理节点域名，打破死锁）
dns:
  enable: true
  listen: :1053
  ipv6: false                
  prefer-h3: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-range6: fdfe:dcba:9876::/64
  fake-ip-filter: ["RULE-SET:private", "RULE-SET:googlefcm", "RULE-SET:ntp", "RULE-SET:cn"]
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver-policy:
    'RULE-SET:ads-all,ads-awavenue,rejects': rcode://name_error
#    'RULE-SET:ads-all,ads-awavenue,ads-blackmatrix7,rejects': rcode://name_error
    'domain:boki.moe,jsdelivr.net,ghproxy.com,ghproxy.net,fastgit.org,staticdn.net,kkgithub.com,ghfast.top, v1.mk,dash.xn--cp3a08l.com':
      - 'quic://dns.alidns.com#🟢 直连'
      - 'https://dns.alidns.com/dns-query#🟢 直连'
    'RULE-SET:cn,apple,microsoft,directs':
      - 'quic://dns.alidns.com#🟢 直连'
      - 'https://dns.alidns.com/dns-query#🟢 直连'
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query


# ==========================================================
# ===== 2. 节点与规则源 (Providers) =====
# ==========================================================
x-provider-anchors:
  Proxyer: &Proxyer
    type: http
    interval: 86400
    exclude-filter: '(?i)(?:佣金|套餐|官网|官方|网址|售后|免翻|过期|剩余|到期|流量|更新|点外|重置|免流|使用|教程|优惠|超实惠|址|群|TG|AFF|Days|Date)'
    health-check: {enable: true, url: "https://cp.cloudflare.com", interval: 300, timeout: 1000, tolerance: 100}
    header: {User-Agent: ["ClashMetaForAndroid/2.11.2.Meta", "clash.meta", "mihomo"]}
  dom: &dom {type: http, behavior: domain, format: mrs, interval: 86400}
  ipc: &ipc {type: http, behavior: ipcidr, format: mrs, interval: 86400}

proxy-providers:
  SubPre: {<<: *Proxyer, path: ./proxy_provider/SubPre.yaml, url: "https://dash.xn--cp3a08l.com/api/v1/pq/909f78b80b755c1018ef61da52294367"}
  SubCF: {<<: *Proxyer, path: ./proxy_provider/SubCF.yaml, url: "https://github.boki.moe/https://raw.githubusercontent.com/aghu1979/mss/refs/heads/release/subs/SubCF.yaml"}
