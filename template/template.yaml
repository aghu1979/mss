  fakelocation_ip: {<<: *ipc, path: ./rules/fakelocation_ip.mrs, url: "https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Mihomo/rule/FakeLocation/FakeLocation_ip.mrs"}
