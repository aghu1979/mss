# ==========================================================
# ===== Mihomo 构建模板 --- 规则与策略 (语法修复版)
# ===== 作者：Mary
# ===== 2026.07.27
# ==========================================================

proxies:
  - name: 🟢 直连
    type: direct
    udp: true
  - name: ⛔️ 拒绝
    type: reject
  - name: ⭕️ DNS_Hijack
    type: dns

proxy-groups:
  # ====================================================
  # [1级] 顶层控制台 (供客户端 UI 界面点选，主力优先)
  # ====================================================
  - name: 🌐 默认代理
    type: select
    proxies:
      - ☁️ SubCF-All
      - 👑 SubPre-All
      - 🆓 SubFree-All
      - 🟢 直连

  # ====================================================
  # [业务级] 细粒度分流策略 (深度优化视频与网页加载体验)
  # ====================================================
  - name: 纯净IP
    type: select
    proxies:
      - 👑 SubPre-新加坡
      - 👑 SubPre-日本
      - 👑 SubPre-香港
      - 👑 SubPre-台湾
      - 👑 SubPre-美国
      - 👑 SubPre-其它
      - ☁️ SubCF-新加坡
      - ☁️ SubCF-日本
      - ☁️ SubCF-香港
      - ☁️ SubCF-台湾
      - ☁️ SubCF-美国
      - ☁️ SubCF-其它
      - 🌐 默认代理
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ChatGPT.png"

  - name: 无纯净IP要求
    type: select
    proxies:
      - ☁️ SubCF-All
      - ☁️ SubCF-新加坡
      - ☁️ SubCF-日本
      - ☁️ SubCF-香港
      - ☁️ SubCF-台湾
      - ☁️ SubCF-美国
      - ☁️ SubCF-其它
      - 🆓 SubFree-All
      - 👑 SubPre-All
      - 🌐 默认代理
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ChatGPT.png"

  - name: Ai
    type: select
    proxies:
      - 👑 SubPre-新加坡
      - 👑 SubPre-日本
      - 👑 SubPre-香港
      - 👑 SubPre-台湾
      - 👑 SubPre-美国
