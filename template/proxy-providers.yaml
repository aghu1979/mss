# ==========================================================
# ===== Mihomo 构建模板 --- 订阅提供商
# ===== 作者：Mary
# ===== 2026.07.27
# ==========================================================

SubPre: &SubPre "https://github.boki.moe/https://raw.githubusercontent.com/aghu1979/mss/refs/heads/release/subs/SubPre.yaml"
SubCF: &SubCF "https://github.boki.moe/https://raw.githubusercontent.com/aghu1979/mss/refs/heads/release/subs/SubCF.yaml"
SubFree: &SubFree "https://github.boki.moe/https://raw.githubusercontent.com/aghu1979/mss/refs/heads/release/subs/SubFree.yaml"
BaiduUrl: &BaiduUrl "https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Mihomo/BaiduProxy.yaml"

# [订阅测速网址]
ProxyTest: &ProxyTest "https://www.gstatic.com/generate_204"
DirecTest: &DirecTest "https://wifi.vivo.com.cn/generate_204"

# ==========================================================
# [核心痛点优化：订阅拉取模板定义]
# 必须放在 proxy-providers 引用之前！
# ==========================================================
Proxyer: &Proxyer
  type: http
  interval: 86400
  exclude-filter: *ExcludeFilter
  health-check:
    enable: true
    url: *ProxyTest
    interval: 86400 
  header:
    User-Agent:
    - "ClashMetaForAndroid/2.11.2.Meta"
    - "clash.meta"
    - "mihomo"

# ==========================================================
# 具体的订阅商配置 (向下引用上方的模板)
# ==========================================================
proxy-providers:
  Sub1:
    <<: *Proxyer
    path: ./proxies/SubPre.yaml
    url: *SubPre
  Sub2:
    <<: *Proxyer
    path: ./proxies/SubCF.yaml
    url: *SubCF
  Sub3:
    <<: *Proxyer
    path: ./proxies/SubFree.yaml
    url: *SubFree
  Baidu:
    <<: *Proxyer
    path: ./proxies/Baidu.yaml
    url: *BaiduUrl