#name: Deploy Mihomo Configs
name: 自动部署 Mihomo Configs

on:
  workflow_run:
    workflows: ["自动节点清洗与探活流水线"]
    types:
      - completed
  workflow_dispatch: # 保留手动触发以备不时之需

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 关键：只在清洗流水线成功时才执行
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    permissions:
      contents: write

    steps:
      - name: Checkout Main Branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Generate Configs
        run: |
          # 执行上一步提供的文本拼接合并脚本
          python scripts/deploy_configs.py

      - name: Deploy to Release Branch (Isolated Method)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git clone -b release https://x-access-token:${{ secrets.GITHUB_TOKEN }}@[github.com/$](https://github.com/$){{ github.repository }}.git release_repo
          
          mkdir -p release_repo/configs
          cp release/configs/*.yaml release_repo/configs/
          
          cd release_repo
          git add configs/
          git commit -m "Auto-deploy configs triggered by Node Cleaner" || echo "No changes to commit"
          
          git pull --rebase origin release
          git push origin release
