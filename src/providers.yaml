# 局部锚点辅助键 (将被构建脚本自动清理)
x-provider-anchors:
  Proxyer: &Proxyer
    type: http
    interval: 86400
    exclude-filter: '(?i)(?:佣金|套餐|官网|官方|网址|售后|免翻|过期|剩余|到期|流量|更新|点外|重置|免流|使用|教程|优惠|超实惠|址|AFF|Days|Date)'
    health-check:
      enable: true
      url: "https://cp.cloudflare.com"  # 采用 Cloudflare 测速，规避 gstatic.com 可能的阻断
      interval: 300
      timeout: 1000
      tolerance: 100
    header:
      User-Agent: ["ClashMetaForAndroid/2.11.2.Meta", "clash.meta", "mihomo"]
  dom: &dom
    type: http
    behavior: domain
    format: mrs
    interval: 86400
  ipc: &ipc
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400

proxy-providers:
  SubPre:
    <<: *Proxyer
    path: ./proxy_provider/SubPre.yaml
    url: "https://github.boki.moe/https://raw.githubusercontent.com/aghu1979/mss/refs/heads/release/subs/SubPre.yaml"
  SubCF:
    <<: *Proxyer
    path: ./proxy_provider/SubCF.yaml
    url: "https://github.boki.moe/https://raw.githubusercontent.com/aghu1979/mss/refs/heads/release/subs/SubCF.yaml"
  SubFree:
    <<: *Proxyer
    path: ./proxy_provider/SubFree.yaml
    url: "https://github.boki.moe/https://raw.githubusercontent.com/aghu1979/mss/refs/heads/release/subs/SubFree.yaml"
  Baidu:
    <<: *Proxyer
    path: ./proxy_provider/Baidu.yaml
    url: "https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Mihomo/BaiduProxy.yaml"

