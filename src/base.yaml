# 基础运行配置
ipv6: true
mode: Rule
log-level: warning
unified-delay: true
tcp-concurrent: true
allow-lan: true
external-controller: 127.0.0.1:9090
external-ui: ./ui/
external-ui-url: "https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Mihomo/static/dist.zip"
secret: ""
skip-auth-prefixes:
  - 10.0.0.1/8
  - 127.0.0.1/8
  - 192.168.0.1/16

geo-auto-update: true
geo-update-interval: 168
geox-url:
  asn: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

lgbm-auto-update: true
lgbm-update-interval: 360
lgbm-url: "https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Mihomo/static/Model-large.bin"

profile:
  store-selected: true
  store-fake-ip: true
  smart-collector-size: 100

ntp:
  enable: true
  write-to-system: false
  server: time.apple.com
  port: 123
  interval: 30

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 5228-5230, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.local"
    - "+.lan"
    - "localhost"
    - "Mijia Cloud"
    - "miwifi.com"

tun:
  enable: true
  device: Meta
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  auto-route: false
  auto-detect-interface: true
  strict-route: false

dns:
  enable: true
  listen: :1053
  ipv6: true
  prefer-h3: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-range6: fdfe:dcba:9876::/64
  fake-ip-filter:
    - "RULE-SET:private"
    - "RULE-SET:googlefcm"
    - "RULE-SET:ntp"
    - "RULE-SET:cn"
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
    - 2400:3200::1
    - 2400:3200:baba::1
  nameserver-policy:
    'RULE-SET:ads-all,ads-awavenue,rejects': rcode://name_error
    'RULE-SET:cn,apple,microsoft,directs':
      - 'quic://dns.alidns.com#🟢 直连'
      - 'https://dns.alidns.com/dns-query#🟢 直连'
  nameserver:
    - 'https://dns.google/dns-query#Google'
    - 'https://cloudflare-dns.com/dns-query#Cloudflare'
