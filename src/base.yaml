# 基础运行配置
ipv6: true               # 保持开启，保留系统级 IPv6 数据包处理能力
mode: Rule
log-level: warning
unified-delay: true
tcp-concurrent: true
allow-lan: true
external-controller: 127.0.0.1:9090
# external-ui: ./ui/
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
secret: ""
skip-auth-prefixes:
  - 10.0.0.1/8
  - 127.0.0.1/8
  - 192.168.0.1/16

geo-auto-update: true
geo-update-interval: 360
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  asn: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"
#  asn: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

lgbm-auto-update: true
lgbm-update-interval: 360
lgbm-url: "https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Mihomo/static/Model-large.bin"

profile:
  store-selected: true
  store-fake-ip: true
  smart-collector-size: 100

ntp:
  enable: true
  write-to-system: false
  server: time.apple.com
  port: 123
  interval: 30

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 5228-5230, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
  - "+.local"
  - "+.lan"
  - "localhost"
  - "Mijia Cloud"
  - "miwifi.com"
  - "+.ts.net"
  - "+.rustdesk.com"
  - "+.anydesk.com"
  - "+.teamviewer.com"
  - "+.oray.com"
  - "+.oray.net"
  - "+.easytier.top"

tun:
  enable: true
  device: Meta
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  auto-route: true
  auto-detect-interface: true
  strict-route: true

dns:
  enable: true
  listen: :1053
  ipv6: false                
  prefer-h3: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-range6: fdfe:dcba:9876::/64
  fake-ip-filter:
    - RULE-SET:private
    - RULE-SET:googlefcm
    - RULE-SET:ntp
    - RULE-SET:cn
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    'RULE-SET:ads-all,ads-awavenue,rejects': rcode://name_error
    'domain:boki.moe,jsdelivr.net,ghproxy.com,ghproxy.net,fastgit.org,staticdn.net,kkgithub.com,v1.mk,dash.xn--cp3a08l.com':
      - 'quic://dns.alidns.com#🟢 直连'
      - 'https://dns.alidns.com/dns-query#🟢 直连'
    'RULE-SET:cn,apple,microsoft,directs':
      - 'quic://dns.alidns.com#🟢 直连'
      - 'https://dns.alidns.com/dns-query#🟢 直连'
  # 将底层解析全部换为国内高可用 DoH，彻底打破 DNS 死锁！
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
