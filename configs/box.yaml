  # ====================================================
  # [补充] 遗漏的路由所需策略组及地区专属策略组
  # ====================================================
  - name: Media
    <<: *Groupp
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ForeignMedia.png"

  - name: 台湾
    <<: *Smartp
    filter: *FilterTW
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Taiwan.png"

  - name: 江苏
    <<: *Smartp
    filter: '(?i)(?:南京|苏州)'
    icon: "https://cdn.jsdelivr.net/gh/lige47/QuanX-icon-rule@main/icon/05icon/lightning(1).png"

  - name: 广东
    <<: *Smartp
    filter: '(?i)(?:广州)'
    icon: "https://cdn.jsdelivr.net/gh/lige47/QuanX-icon-rule@main/icon/05icon/lightning(2).png"

  - name: 北京
    <<: *Smartp
    filter: '(?i)(?:北京|保定)'
    icon: "https://cdn.jsdelivr.net/gh/lige47/QuanX-icon-rule@main/icon/05icon/lightning(3).png"

  - name: 香港
    <<: *Smartp
    filter: *FilterHK
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png"

  - name: 狮城
    <<: *Smartp
    filter: *FilterSG
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png"

  - name: 日本
    <<: *Smartp
    filter: *FilterJP
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png"

  - name: 美国
    <<: *Smartp
    filter: *FilterUS
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png"


  # ====================================================
  # [2级] 资产粗筛池 (仅作全量合并，方便上层调用)
  # ====================================================
  - {name: 👑 SubPre-All, <<: *Smartp, use: [SubPre]}
  - {name: ☁️ SubCF-All, <<: *Smartp, use: [SubCF]}
  # 已按建议将不稳定的免费池改为 fallback，避免 hash 死节点导致断流
  - {name: 🆓 SubFree-All, type: fallback, use: [SubFree]}

  # ====================================================
  # [3级] 细粒度池 - SubPre (优质付费订阅隔离)
  # ====================================================
  - {name: 👑 SubPre-香港, <<: *Smartp, use: [SubPre], filter: *FilterHK}
  - {name: 👑 SubPre-台湾, <<: *Smartp, use: [SubPre], filter: *FilterTW}
  - {name: 👑 SubPre-日本, <<: *Smartp, use: [SubPre], filter: *FilterJP}
  - {name: 👑 SubPre-新加坡, <<: *Smartp, use: [SubPre], filter: *FilterSG}
  - {name: 👑 SubPre-美国, <<: *Smartp, use: [SubPre], filter: *FilterUS}
  - {name: 👑 SubPre-其它, <<: *Smartp, use: [SubPre], filter: *FilterOther}

  # ====================================================
  # [3级] 细粒度池 - SubCF (自建免费大带宽隔离)
  # ====================================================
  - {name: ☁️ SubCF-香港, <<: *Smartp, use: [SubCF], filter: *FilterHK}
  - {name: ☁️ SubCF-台湾, <<: *Smartp, use: [SubCF], filter: *FilterTW}
  - {name: ☁️ SubCF-日本, <<: *Smartp, use: [SubCF], filter: *FilterJP}
  - {name: ☁️ SubCF-新加坡, <<: *Smartp, use: [SubCF], filter: *FilterSG}
  - {name: ☁️ SubCF-美国, <<: *Smartp, use: [SubCF], filter: *FilterUS}
  - {name: ☁️ SubCF-其它, <<: *Smartp, use: [SubCF], filter: *FilterOther}

  # ====================================================
  # [3级] 细粒度池 - SubFree (免费脏流量池隔离)
  # ====================================================
  - {name: 🆓 SubFree-香港, type: fallback, use: [SubFree], filter: *FilterHK}
  - {name: 🆓 SubFree-台湾, type: fallback, use: [SubFree], filter: *FilterTW}
  - {name: 🆓 SubFree-日本, type: fallback, use: [SubFree], filter: *FilterJP}
  - {name: 🆓 SubFree-新加坡, type: fallback, use: [SubFree], filter: *FilterSG}
  - {name: 🆓 SubFree-美国, type: fallback, use: [SubFree], filter: *FilterUS}
  - {name: 🆓 SubFree-其它, type: fallback, use: [SubFree], filter: *FilterOther}

# ====================================================
# 分流规则提供者 (全 Mrs 格式，大幅节省常驻内存)
# ====================================================
rule-providers:
  dom: &dom
    type: http
    behavior: domain
    format: mrs
    interval: 86400
  ipc: &ipc
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400

  directs:
    <<: *dom
    path: ./rules/directs.mrs
    url: "https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Mihomo/rule/Direct/Direct.mrs"
  directs_ip:
    <<: *ipc
    path: ./rules/directs_ip.mrs
    url: "https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Mihomo/rule/Direct/Direct_ip.mrs"
  rejects:
    <<: *dom
    path: ./rules/rejects.mrs
    url: "https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Mihomo/rule/Reject/Reject.mrs"
  rejects_ip:
    <<: *ipc
    path: ./rules/rejects_ip.mrs
    url: "https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Mihomo/rule/Reject/Reject_ip.mrs"
  proxys:
    <<: *dom
    path: ./rules/proxys.mrs
    url: "https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Mihomo/rule/Proxy/Proxy.mrs"
  proxys_ip:
    <<: *ipc
    path: ./rules/proxys_ip.mrs
    url: "https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Mihomo/rule/Proxy/Proxy_ip.mrs"
  fakelocation:
    <<: *dom
    path: ./rules/fakelocation.mrs
    url: "https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Mihomo/rule/FakeLocation/FakeLocation.mrs"
  fakelocation_ip:
    <<: *ipc
    path: ./rules/fakelocation_ip.mrs
    url: "https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Mihomo/rule/FakeLocation/FakeLocation_ip.mrs"
  emby:
    <<: *dom
    path: ./rules/emby.mrs
    url: "https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Mihomo/rule/Emby/Emby.mrs"
  awavenue:
    <<: *dom
    path: ./rules/awavenue.mrs
    url: "https://cdn.jsdelivr.net/gh/TG-Twilight/AWAvenue-Ads-Rule@main/Filters/AWAvenue-Ads-Rule-Clash.mrs"
  private:
    <<: *dom
    path: ./rules/private.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs"
  private_ip:
