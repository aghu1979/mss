# ====================================================
# 路由规则匹配
# ====================================================
rules:
  # 0. 【优先处理特定自定义域名】
  - DOMAIN-SUFFIX,4d4y.com,HiPDA

# 🔧 1. 【DNS 劫持放行 (最高优先级)】
- DST-PORT,53,⭕️ DNS_Hijack
- DST-PORT,853,⭕️ DNS_Hijack
- DST-PORT,8853,⭕️ DNS_Hijack

# 🛡️ 2. 【独立 WebRTC 强效防御特权区】
- DOMAIN-KEYWORD,stun,WebRTC
- DOMAIN-KEYWORD,turn,WebRTC
- AND,((NETWORK,udp),(DST-PORT,3478-3479)),WebRTC
- AND,((NETWORK,udp),(DST-PORT,5349-5350)),WebRTC
- AND,((NETWORK,udp),(DST-PORT,19302-19309)),WebRTC
- RULE-SET,webrtc,WebRTC

