# ==========================================================
# ===== Mihomo 构建模板 --- 软件差异化 box.diff
# ===== 作者：Mary
# ===== 2026.07.27
# ==========================================================

# 1. 代理通信端口 (必须与 settings.ini 严格一致)
mixed-port: 7890
redir-port: 9797
tproxy-port: 9898

# 2. 面板与 API 接口 (脚本会检测并动态注入)
external-controller: 127.0.0.1:9090
external-ui: ./ui/
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
secret: ""

# 3. TUN 虚拟网卡 (受 App 控制)
tun:
  enable: true
  device: meta
  stack: gvisor # Box 默认推荐 gvisor，混合模式下可改 mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  auto-route: true
  auto-detect-interface: true
  strict-route: true # 开启大陆IP分流时，Box 脚本会自动接管并修改此处\n\n﻿# ==========================================================
# ===== Mihomo 构建模板 --- 全局设置与配置锚点
# ===== 作者：Mary
# ===== 2026.07.27
# ==========================================================

# [正则筛选] 按国家全称严格分类
FilterHK: &FilterHK '(?i)(?:港|香港|🇭🇰|HK|Hong\s?Kong)'
FilterTW: &FilterTW '(?i)(?:台|台湾|🇼🇸|🇹🇼|TW|Taiwan)'
FilterSG: &FilterSG '(?i)(?:坡|新加坡|🇸🇬|SG|Singapore)'
FilterJP: &FilterJP '(?i)(?:日|日本|🇯🇵|JP|Japan)'
FilterUS: &FilterUS '(?i)(?:美|美国|🇺🇸|US|States|America)'
FilterOther: &FilterOther '^(?!.*(香港|台湾|新加坡|日本|美国|🇭🇰|🇼🇸|🇨🇳|🇹🇼|🇸🇬|🇯🇵|🇺🇸|HK|TW|SG|JP|US))'

# [垃圾过滤净化列表]
ExcludeFilter: &ExcludeFilter '(?i)(?:佣金|套餐|官网|官方|网址|售后|免翻|过期|剩余|到期|流量|更新|点外|重置|免流|使用|教程|优惠|超实惠|址|频道|群|订阅|AFF|Days|Date|TG)'

# [外部资源与模型更新]
geo-auto-update: true
geo-update-interval: 168
geox-url:
  asn: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

lgbm-auto-update: true
lgbm-update-interval: 360
lgbm-url: "https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model-middle.bin"

profile:
  store-selected: true
  store-fake-ip: true
  smart-collector-size: 100

# [DNS 接管]
dns:
  enable: true
  listen: :1053
  ipv6: false
  prefer-h3: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter:
    - "RULE-SET:private"
    - "RULE-SET:ntp"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  cndoh: &cndoh
    - 'quic://dns.alidns.com#🟢 直连'
    - 'https://dns.alidns.com/dns-query#🟢 直连'
  cgdoh: &cgdoh
    - 'https://dns.google/dns-query#👑 SubPre-All'
    - 'https://cloudflare-dns.com/dns-query#👑 SubPre-All'
  nameserver-policy:
    'RULE-SET:ads-all,awavenue,rejects': rcode://name_error
    'RULE-SET:cn,apple,microsoft,directs': *cndoh
  nameserver: *cgdoh

# [全局策略组模板锚点 (供 rule-providers&rules 模块调用)]
Groupd: &Groupd
  type: select
  proxies:
    - 🟢 直连
    - 🌐 默认代理

  Groupp: &Groupp
    type: select
    proxies:
      - 👑 SubPre-All
      - ☁️ SubCF-All
      - 🌐 默认代理

  Smartp: &Smartp
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50\n\n﻿# ==========================================================
# ===== Mihomo 构建模板 --- 订阅提供商
# ===== 作者：Mary
# ===== 2026.07.27
# ==========================================================

SubPre: &SubPre "https://github.boki.moe/https://raw.githubusercontent.com/aghu1979/mss/refs/heads/release/subs/SubPre.yaml"
SubCF: &SubCF "https://github.boki.moe/https://raw.githubusercontent.com/aghu1979/mss/refs/heads/release/subs/SubCF.yaml"
SubFree: &SubFree "https://github.boki.moe/https://raw.githubusercontent.com/aghu1979/mss/refs/heads/release/subs/SubFree.yaml"
BaiduUrl: &BaiduUrl "https://cdn.jsdelivr.net/gh/MeALiYeYe/ProxyConfigFiles@main/Mihomo/BaiduProxy.yaml"

# [订阅测速网址]
ProxyTest: &ProxyTest "https://www.gstatic.com/generate_204"
DirecTest: &DirecTest "https://wifi.vivo.com.cn/generate_204"

# ==========================================================
# [核心痛点优化：订阅拉取模板定义]
# 必须放在 proxy-providers 引用之前！
# ==========================================================
Proxyer: &Proxyer
  type: http
  interval: 86400
  exclude-filter: *ExcludeFilter
  health-check:
    enable: true
    url: *ProxyTest
    interval: 86400 
  header:
    User-Agent:
    - "ClashMetaForAndroid/2.11.2.Meta"
    - "clash.meta"
    - "mihomo"

# ==========================================================
# 具体的订阅商配置 (向下引用上方的模板)
# ==========================================================
proxy-providers:
  Sub1:
    <<: *Proxyer
    path: ./proxies/SubPre.yaml
    url: *SubPre
  Sub2:
    <<: *Proxyer
    path: ./proxies/SubCF.yaml
    url: *SubCF
  Sub3:
    <<: *Proxyer
    path: ./proxies/SubFree.yaml
    url: *SubFree
  Baidu:
    <<: *Proxyer
    path: ./proxies/Baidu.yaml
    url: *BaiduUrl\n\n﻿# ==========================================================
# ===== Mihomo 构建模板 --- 规则与策略 (语法修复版)
# ===== 作者：Mary
# ===== 2026.07.27
