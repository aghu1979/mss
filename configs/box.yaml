proxies:
  - name: 🟢 直连
    type: direct
    udp: true
  - name: ⛔️ 拒绝
    type: reject
  - name: ⭕️ DNS_Hijack
    type: dns

proxy-groups:
  # ====================================================
  # [1级] 顶层控制台 (供客户端 UI 界面点选，主力优先)
