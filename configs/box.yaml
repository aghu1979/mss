# ==============================================================================
# Mihomo Universal Config for KernelSU (Box & Surfing Compatible)
# Architecture: Standard 3-Tier Proxy Pool Allocation (Strict Anchor Version)
# ==============================================================================

# 1. 基础全局配置
mixed-port: 7890
redir-port: 9797
tproxy-port: 9898
ipv6: true
mode: Rule
log-level: warning
allow-lan: true
unified-delay: true
tcp-concurrent: true
find-process-mode: always

# 2. 存储与面板
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
external-ui: ./dashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
secret: ""

# 3. 节点订阅池定义 (Proxy Providers) - 已使用内联锚点适配 Box
proxy-providers:
  SubPre:
    <<: *provider_base
    url: "https://dash.xn--cp3a08l.com/api/v1/pq/909f78b80b755c1018ef61da52294367"
    path: ./proxies/SubPre.yaml
    override:
      additional-prefix: "👑 "

  SubCF:
    <<: *provider_base
    url: "https://github.boki.moe/https://raw.githubusercontent.com/aghu1979/mss/refs/heads/release/subs/SubCF.yaml"
    path: ./proxies/SubCF.yaml
    override:
      additional-prefix: "☁️ "

  SubFree:
    <<: *provider_base
    url: "https://github.boki.moe/https://raw.githubusercontent.com/aghu1979/mss/refs/heads/release/subs/SubFree.yaml"
    path: ./proxies/SubFree.yaml
    override:
      additional-prefix: "🆓 "

# 4. 策略组配置 (Proxy Groups)
proxy-groups:
  # ----------------- 业务分流入口 -----------------
  - name: 🚀 节点选择
    type: select
    proxies:
      - 👑 SubPre-All
      - ☁️ SubCF-All
      - 👑 SubPre-香港
      - 👑 SubPre-新加坡
      - 👑 SubPre-日本
      - 👑 SubPre-美国
      - 🟢 直连

  - name: 🤖 AI 智能
    type: select
    proxies:
      - 👑 SubPre-美国
      - 👑 SubPre-新加坡
      - 👑 SubPre-日本
      - 👑 SubPre-All

  - name: 📺 境外媒体
    type: select
    proxies:
      - 👑 SubPre-香港
      - 👑 SubPre-新加坡
      - 👑 SubPre-日本
      - 👑 SubPre-台湾
      - ☁️ SubCF-All

  - name: 📲 Telegram
    type: select
    proxies:
      - 👑 SubPre-新加坡
      - 👑 SubPre-香港
      - ☁️ SubCF-All

  - name: 🛑 广告拦截
    type: select
    proxies:
      - ⛔️ 拒绝
      - 🟢 直连

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - 🟢 直连

  # ----------------- 细分策略池 (SubCF 组) -----------------
  - name: ☁️ SubCF-All
    type: select
    use: [SubCF]

  - name: ☁️ SubCF-香港
    type: select
    use: [SubCF]
    filter: '(?i)(?:港|香港|🇭🇰|HK|Hong\s?Kong)'

  - name: ☁️ SubCF-台湾
    type: select
    use: [SubCF]
    filter: '(?i)(?:台|台湾|🇼🇸|🇹🇼|TW|Taiwan)'

  - name: ☁️ SubCF-新加坡
    type: select
    use: [SubCF]
    filter: '(?i)(?:坡|新加坡|🇸🇬|SG|Singapore)'

  - name: ☁️ SubCF-日本
    type: select
    use: [SubCF]
    filter: '(?i)(?:日|日本|🇯🇵|JP|Japan)'

  - name: ☁️ SubCF-美国
    type: select
    use: [SubCF]
    filter: '(?i)(?:美|美国|🇺🇸|US|States|America)'

  - name: ☁️ SubCF-其它
    type: select
    use: [SubCF]
    filter: '^(?!.*(香港|台湾|新加坡|日本|美国|🇭🇰|🇹🇼|🇸🇬|🇯🇵|🇺🇸|HK|TW|SG|JP|US|港|台|坡|日|美)).*'

  # ----------------- 细分策略池 (SubPre 组) -----------------
  - name: 👑 SubPre-All
    type: select
    use: [SubPre]

  - name: 👑 SubPre-香港
    type: select
    use: [SubPre]
    filter: '(?i)(?:港|香港|🇭🇰|HK|Hong\s?Kong)'

  - name: 👑 SubPre-台湾
    type: select
    use: [SubPre]
    filter: '(?i)(?:台|台湾|🇼🇸|🇹🇼|TW|Taiwan)'

  - name: 👑 SubPre-新加坡
    type: select
    use: [SubPre]
    filter: '(?i)(?:坡|新加坡|🇸🇬|SG|Singapore)'

  - name: 👑 SubPre-日本
    type: select
    use: [SubPre]
    filter: '(?i)(?:日|日本|🇯🇵|JP|Japan)'

  - name: 👑 SubPre-美国
    type: select
    use: [SubPre]
    filter: '(?i)(?:美|美国|🇺🇸|US|States|America)'

  - name: 👑 SubPre-其它
    type: select
    use: [SubPre]
    filter: '^(?!.*(香港|台湾|新加坡|日本|美国|🇭🇰|🇹🇼|🇸🇬|🇯🇵|🇺🇸|HK|TW|SG|JP|US|港|台|坡|日|美)).*'

  # ----------------- 细分策略池 (SubFree 组) -----------------
  - name: 🆓 SubFree-All
    type: select
    use: [SubFree]

# 5. 基础代理定义
proxies:
  - name: 🟢 直连
    type: direct
    udp: true
  - name: ⛔️ 拒绝
    type: reject

# 6. TUN 网卡模块
tun:
  enable: true
  device: Mihomo
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true
  strict-route: false

# 7. 流量嗅探
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.local"
    - "+.lan"
    - "localhost"

# 8. DNS 防泄漏配置
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter:
    - "RULE-SET:private"
    - "RULE-SET:googlefcm"
    - "RULE-SET:cn"
    - "+.market.xiaomi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    "RULE-SET:cn,private":
      - https://dns.alidns.com/dns-query#🟢 直连
      - https://doh.pub/dns-query#🟢 直连
  nameserver:
    - https://dns.google/dns-query#🚀 节点选择
    - https://1.1.1.1/dns-query#🚀 节点选择

# 9. 规则集定义 (Rule Providers) - 已使用内联锚点适配 Box
rule-providers:
  private:
    <<: &dom
      type: http
      behavior: domain
      format: mrs
      interval: 86400
    path: ./rules/private.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs"
  ads:
    <<: *dom
    path: ./rules/ads.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ads-all.mrs"
  googlefcm:
    <<: *dom
    path: ./rules/googlefcm.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/googlefcm.mrs"
  ai:
    <<: *dom
    path: ./rules/ai.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ai-chat-!cn.mrs"
  youtube:
    <<: *dom
    path: ./rules/youtube.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/youtube.mrs"
  telegram:
    <<: *dom
    path: ./rules/telegram.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/telegram.mrs"
  cn:
    <<: *dom
    path: ./rules/cn.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs"
  cn_ip:
    <<: &ipc
      type: http
      behavior: ipcidr
      format: mrs
      interval: 86400
    path: ./rules/cn_ip.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs"

# 10. 分流规则 (Rules)
rules:
  - RULE-SET,private,🟢 直连
  - RULE-SET,ads,🛑 广告拦截
  - RULE-SET,googlefcm,🟢 直连
  - RULE-SET,ai,🤖 AI 智能
  - RULE-SET,youtube,📺 境外媒体
  - RULE-SET,telegram,📲 Telegram
  - RULE-SET,cn,🟢 直连
  - RULE-SET,cn_ip,🟢 直连,no-resolve
  - MATCH,🐟 漏网之鱼

# 配置文件结束
